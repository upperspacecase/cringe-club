<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cringe Club - Courage Challenge Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Patrick+Hand&display=swap');

    :root {
      --courage-pink: #e84393;
      --courage-purple: #6c5ce7;
      --courage-dark: #2d1b4e;
      --courage-darker: #1a0f2e;
      --courage-green: #00b894;
      --courage-red: #d63031;
      --courage-yellow: #fdcb6e;
      --courage-blue: #74b9ff;
      --nowhere-bg: #1a0f2e;
      --card-bg: #2d1b4e;
      --text-light: #dfe6e9;
      --text-muted: #a29bba;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Patrick Hand', cursive;
      background: var(--nowhere-bg);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Stars background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 60% 75%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.7), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 16px 10px;
    }

    .header h1 {
      font-family: 'Creepster', cursive;
      font-size: 2.2rem;
      color: var(--courage-pink);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }

    .header .subtitle {
      font-size: 1rem;
      color: var(--courage-yellow);
      margin-top: 2px;
    }

    .courage-emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 4px;
    }

    /* Tab bar */
    .tab-bar {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--courage-dark);
      border-top: 2px solid var(--courage-purple);
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Patrick Hand', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn.active {
      color: var(--courage-pink);
      background: rgba(232, 67, 147, 0.1);
    }

    .tab-btn .tab-icon {
      font-size: 1.4rem;
    }

    /* Tab content */
    .tab-content {
      display: none;
      padding: 12px 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* Voting tab */
    .add-item-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-item-form input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--courage-purple);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text-light);
      font-family: 'Patrick Hand', cursive;
      font-size: 1rem;
      outline: none;
    }

    .add-item-form input::placeholder {
      color: var(--text-muted);
    }

    .add-item-form input:focus {
      border-color: var(--courage-pink);
    }

    .add-item-form button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--courage-pink);
      color: white;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s;
    }

    .add-item-form button:active {
      transform: scale(0.95);
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid rgba(108, 92, 231, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s;
    }

    .item-card:active {
      transform: scale(0.99);
    }

    .item-rank {
      font-family: 'Creepster', cursive;
      font-size: 1.3rem;
      color: var(--courage-yellow);
      min-width: 28px;
      text-align: center;
    }

    .item-text {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .vote-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .vote-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      line-height: 1;
    }

    .vote-btn:active {
      transform: scale(1.3);
    }

    .vote-btn.up:hover { background: rgba(0, 184, 148, 0.2); }
    .vote-btn.down:hover { background: rgba(214, 48, 49, 0.2); }

    .vote-count {
      font-family: 'Creepster', cursive;
      font-size: 1.2rem;
      color: var(--courage-green);
      min-width: 24px;
      text-align: center;
    }

    .vote-count.negative {
      color: var(--courage-red);
    }

    /* Tracker tab */
    .tracker-section {
      margin-bottom: 16px;
    }

    .add-participant-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-participant-form input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid var(--courage-purple);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text-light);
      font-family: 'Patrick Hand', cursive;
      font-size: 1rem;
      outline: none;
    }

    .add-participant-form input::placeholder {
      color: var(--text-muted);
    }

    .add-participant-form button {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: var(--courage-purple);
      color: white;
      font-family: 'Creepster', cursive;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .tracker-table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid rgba(108, 92, 231, 0.3);
    }

    .tracker-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 400px;
    }

    .tracker-table th {
      background: var(--courage-dark);
      padding: 10px 8px;
      font-family: 'Creepster', cursive;
      font-size: 0.95rem;
      color: var(--courage-yellow);
      position: sticky;
      top: 0;
      white-space: nowrap;
      border-bottom: 2px solid var(--courage-purple);
    }

    .tracker-table th:first-child {
      text-align: left;
      min-width: 160px;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .tracker-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(108, 92, 231, 0.15);
      text-align: center;
      background: var(--card-bg);
    }

    .tracker-table td:first-child {
      text-align: left;
      font-size: 0.95rem;
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--card-bg);
    }

    .tracker-table tr:nth-child(even) td {
      background: rgba(45, 27, 78, 0.8);
    }

    .tracker-table tr:nth-child(even) td:first-child {
      background: rgba(45, 27, 78, 0.8);
    }

    .tracker-table tr:hover td {
      background: rgba(108, 92, 231, 0.15);
    }

    /* Custom checkbox */
    .check-cell {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .custom-check {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 2px solid var(--courage-purple);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .custom-check:checked {
      background: var(--courage-green);
      border-color: var(--courage-green);
    }

    .custom-check:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      color: white;
    }

    .custom-check:active {
      transform: scale(0.9);
    }

    /* Section header */
    .section-title {
      font-family: 'Creepster', cursive;
      font-size: 1.3rem;
      color: var(--courage-purple);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state .scared {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--courage-purple);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Patrick Hand', cursive;
      font-size: 1rem;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--nowhere-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--courage-purple);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span class="courage-emoji">🐕</span>
      <h1>Cringe Club</h1>
      <div class="subtitle">The things I do for courage...</div>
    </div>

    <!-- Tab 1: Voting -->
    <div id="tab-vote" class="tab-content active">
      <div class="section-title">🗳️ Challenge Proposals</div>
      <form class="add-item-form" onsubmit="addItem(event)">
        <input type="text" id="new-item" placeholder="Suggest a cringeworthy challenge..." maxlength="300" />
        <button type="submit">Add!</button>
      </form>
      <div id="items-list">
        <div class="loading">Loading challenges...</div>
      </div>
    </div>

    <!-- Tab 2: Tracker -->
    <div id="tab-tracker" class="tab-content">
      <div class="section-title">📋 Challenge Tracker</div>
      <form class="add-participant-form" onsubmit="addParticipant(event)">
        <input type="text" id="new-participant" placeholder="Add participant..." maxlength="50" />
        <button type="submit">Add</button>
      </form>
      <div id="tracker-content">
        <div class="loading">Loading tracker...</div>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('vote')">
      <span class="tab-icon">🗳️</span>
      <span>Challenges</span>
    </button>
    <button class="tab-btn" onclick="switchTab('tracker')">
      <span class="tab-icon">📋</span>
      <span>Tracker</span>
    </button>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    let items = [];
    let participants = [];
    let completions = [];

    // --- Tab switching ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.querySelectorAll('.tab-btn')[tab === 'vote' ? 0 : 1].classList.add('active');
      if (tab === 'tracker') loadTracker();
    }

    // --- Toast ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // --- API helpers ---
    async function api(url, opts) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...opts
      });
      return res.json();
    }

    // --- Items / Voting ---
    async function loadItems() {
      items = await api('/api/items');
      renderItems();
    }

    function renderItems() {
      const list = document.getElementById('items-list');
      if (!items.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="scared">😰</div>
            <div>No challenges yet... be brave!</div>
          </div>`;
        return;
      }
      list.innerHTML = items.map((item, i) => `
        <div class="item-card">
          <div class="item-rank">#${i + 1}</div>
          <div class="item-text">${escapeHtml(item.text)}</div>
          <div class="vote-controls">
            <button class="vote-btn up" onclick="vote('${item._id}', 'up')" title="Upvote">▲</button>
            <div class="vote-count ${item.votes < 0 ? 'negative' : ''}">${item.votes}</div>
            <button class="vote-btn down" onclick="vote('${item._id}', 'down')" title="Downvote">▼</button>
          </div>
        </div>
      `).join('');
    }

    async function addItem(e) {
      e.preventDefault();
      const input = document.getElementById('new-item');
      const text = input.value.trim();
      if (!text) return;
      await api('/api/items', {
        method: 'POST',
        body: JSON.stringify({ text })
      });
      input.value = '';
      showToast('Stupid dog! Challenge added!');
      loadItems();
    }

    async function vote(id, direction) {
      await api(`/api/items/${id}/vote`, {
        method: 'POST',
        body: JSON.stringify({ direction })
      });
      loadItems();
    }

    // --- Tracker ---
    async function loadTracker() {
      const [itemsData, partsData, compsData] = await Promise.all([
        api('/api/items'),
        api('/api/participants'),
        api('/api/completions')
      ]);
      items = itemsData;
      participants = partsData;
      completions = compsData;
      renderTracker();
    }

    function renderTracker() {
      const container = document.getElementById('tracker-content');
      const top30 = items.slice(0, 30);

      if (!top30.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="scared">😰</div>
            <div>No challenges to track yet!</div>
          </div>`;
        return;
      }

      if (!participants.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="scared">🐕</div>
            <div>No participants yet! Add someone above.</div>
          </div>`;
        return;
      }

      const completionMap = {};
      completions.forEach(c => {
        completionMap[`${c.itemId}_${c.participant}`] = c.completed;
      });

      container.innerHTML = `
        <div class="tracker-table-wrapper">
          <table class="tracker-table">
            <thead>
              <tr>
                <th>Challenge</th>
                ${participants.map(p => `<th>${escapeHtml(p.name)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${top30.map(item => `
                <tr>
                  <td>${escapeHtml(item.text)}</td>
                  ${participants.map(p => {
                    const key = `${item._id}_${p.name}`;
                    const checked = completionMap[key] ? 'checked' : '';
                    return `
                      <td>
                        <div class="check-cell">
                          <input type="checkbox" class="custom-check" ${checked}
                            onchange="toggleCompletion('${item._id}', '${escapeHtml(p.name)}', this.checked)" />
                        </div>
                      </td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    async function addParticipant(e) {
      e.preventDefault();
      const input = document.getElementById('new-participant');
      const name = input.value.trim();
      if (!name) return;
      const res = await api('/api/participants', {
        method: 'POST',
        body: JSON.stringify({ name })
      });
      if (res.error) {
        showToast(res.error);
        return;
      }
      input.value = '';
      showToast(`${name} joined the Cringe Club!`);
      loadTracker();
    }

    async function toggleCompletion(itemId, participant, completed) {
      await api('/api/completions', {
        method: 'POST',
        body: JSON.stringify({ itemId, participant, completed })
      });
    }

    // --- Util ---
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Init ---
    loadItems();
  </script>
</body>
</html>
